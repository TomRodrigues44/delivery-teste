<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login Admin - Loja Aparecida</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body{font-family:Arial,sans-serif;background:#fff8f0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}
    .login-box{background:#fff;padding:30px;border-radius:15px;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:400px;width:100%;}
    h2{text-align:center;color:#e5630e;}
    input{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:1px solid #ddd;}
    button{width:100%;padding:10px;background:#ff8800;border:none;color:#fff;font-weight:bold;border-radius:8px;cursor:pointer;}
    .error{color:red;text-align:center;margin-top:10px;}
  </style>
</head>
<body>

<div class="login-box">
  <h2>Login Admin</h2>
  <input type="email" id="email" placeholder="E-mail">
  <input type="password" id="senha" placeholder="Senha">
  <button id="btnLogin">Entrar</button>
  <div class="error" id="erro"></div>
</div>

<script src="login.js"></script>
</body>
</html>
