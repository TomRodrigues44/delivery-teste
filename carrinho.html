<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Carrinho - Empório das Coxinhas</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>Seu Carrinho</h1>
    <nav>
      <a href="index.html">Voltar</a>
    </nav>
  </header>
  <main>
    <div id="lista-carrinho"></div>
    <div id="total"></div>
    <form id="finalizar-pedido">
      <h2>Finalizar Pedido</h2>
      <label>Nome: <input type="text" name="nome" required></label><br>
      <label>Telefone (WhatsApp): <input type="text" name="telefone" required></label><br>
      <label>Endereço para entrega: <input type="text" name="endereco" required></label><br>
      <button type="submit">Enviar Pedido</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2025 Empório das Coxinhas</p>
  </footer>
  <script src="js/carrinho.js"></script>
</body>
</html>
